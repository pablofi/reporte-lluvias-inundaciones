[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reporte-lluvias-inundaciones"
version = "0.1.0"
description = "Aplicación interna de reportes de lluvias e inundaciones — fase 01"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn==0.34.2",
  "jinja2==3.1.6",
  "SQLAlchemy==2.0.41",
  "pydantic==2.11.5",
  "pydantic-settings==2.9.1",
  "httpx==0.28.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
